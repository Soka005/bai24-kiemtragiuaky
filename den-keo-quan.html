<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đèn kéo quân - Trương Long</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="lantern-page">
    <div class="topbar"><div class="inner"><a class="brand" href="index.html">&#127989; <span data-name></span> &middot; <span data-mssv></span></a><a class="link" href="index.html">Trang chủ</a><a class="link" href="bai17.html">Bài 17</a><a class="link" href="bai18.html">Bài 18</a><a class="link" href="bai19.html">Bài 19</a><a class="link" href="bai20.html">Bài 20</a><a class="link" href="bai21.html">Bài 21</a><a class="link" href="bai22.html">Bài 22</a><a class="link active" href="den-keo-quan.html">Đèn kéo quân</a></div></div>
    <div class="scene">
        <header class="hero">
            <h1>&#127982; Đèn kéo quân</h1>
            <p>Hiệu ứng JavaScript &middot; <span data-name></span> &middot; <span data-mssv></span></p>
        </header>

        <div class="stage">
            <div class="glow"></div>
            <div class="string"></div>
            <div class="cap top"></div>
            <div class="lantern" id="lantern">
                <div class="face"><img src="images/lantern/1.jpg" alt="Ảnh 1" data-ph="1.jpg"><div class="tag">Ảnh 1</div></div><div class="face"><img src="images/lantern/2.jpg" alt="Ảnh 2" data-ph="2.jpg"><div class="tag">Ảnh 2</div></div><div class="face"><img src="images/lantern/3.jpg" alt="Ảnh 3" data-ph="3.jpg"><div class="tag">Ảnh 3</div></div><div class="face"><img src="images/lantern/4.jpg" alt="Ảnh 4" data-ph="4.jpg"><div class="tag">Ảnh 4</div></div><div class="face"><img src="images/lantern/5.jpg" alt="Ảnh 5" data-ph="5.jpg"><div class="tag">Ảnh 5</div></div><div class="face"><img src="images/lantern/6.jpg" alt="Ảnh 6" data-ph="6.jpg"><div class="tag">Ảnh 6</div></div>
            </div>
            <div class="cap bottom"></div>
            <div class="tassel"></div>
        </div>

        <p class="status" id="status"></p>
        <div class="controls">
            <label for="speed">Tốc độ quay:</label>
            <input type="range" id="speed" min="0.1" max="1.5" step="0.05" value="0.4">
        </div>
        <p class="hint">Rê chuột vào một hình bất kỳ thì đèn dừng lại. Rê chuột ra thì đèn quay tiếp. Trên điện thoại: chạm giữ để dừng, thả tay để quay tiếp.</p>
    </div>
    <footer>&copy; 2026 <span data-name></span> &middot; <span data-mssv></span> &middot; <span data-course></span></footer>
    <script src="js/site.js"></script>
    <script src="js/lantern.js"></script>
</body>
</html>
